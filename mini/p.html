<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>__TITLE__</title>
__META__
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<!--
  WHY THIS PAGE EXISTS
  The page a PropLync Mini customer shares: their card and up to 10 properties, each
  with a "Me interesa" button that opens WhatsApp with the property named. It is
  white-label (the agent's name, logo, cover and colour; PropLync only in a small
  footer badge), because the agent is the brand the buyer is talking to.

  HOW IT IS BUILT
  mini/api/page.js renders this file on the server: the link-preview tags plus the
  page data as JSON in #mp-data. Everything visible is drawn here from that JSON,
  and every value from it is untrusted (agency text, listing text, URLs), so text
  goes through escapeHtml, links through safeUrl and backgrounds through cssUrl.
-->
<style>
  :root{--mp-accent:var(--gold);--mp-accent-ink:var(--ink);--mp-accent-hi:var(--mp-accent)}
  /* --mp-accent-hi: the accent as text on navy. A dark brand colour is lifted toward cream so it stays readable there. */
  body{background:var(--paper);color:var(--ink);font-family:var(--body);margin:0}
  /* the footer sits at the bottom even on a short page (paused, not found) */
  #mp-root{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
  #mp-root > main{flex:1}
  section{padding:0}
  .mp-wrap{max-width:1080px;margin:0 auto;padding:0 var(--gutter)}

  /* top bar: the agent's mark, not ours */
  .mp-bar{position:sticky;top:0;z-index:20;background:rgba(10,22,40,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.06)}
  .mp-bar .mp-wrap{display:flex;align-items:center;justify-content:space-between;height:58px;gap:12px}
  .mp-brand{display:flex;align-items:center;gap:10px;min-width:0;color:var(--on-ink);text-decoration:none}
  .mp-mark{width:32px;height:32px;border-radius:9px;flex:none;background:var(--mp-accent) center/cover no-repeat;color:var(--mp-accent-ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:1rem}
  .mp-brand b{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mp-lang{display:flex;border:1px solid rgba(255,255,255,.16);border-radius:999px;overflow:hidden;flex:none}
  .mp-lang button{background:none;border:0;color:var(--on-ink-dim);font:600 .66rem var(--mono);letter-spacing:.08em;padding:7px 10px;cursor:pointer}
  .mp-lang button.on{background:var(--mp-accent);color:var(--mp-accent-ink)}

  /* hero: the agent's card, in the landing's language (navy, a glow in the agent's colour, a faint grid,
     Fraunces with one italic word). The glow and accents follow --mp-accent, so a branded page stays theirs. */
  .mp-hero{background:var(--ink) center/cover no-repeat;color:var(--on-ink);position:relative;overflow:hidden}
  .mp-hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:
    radial-gradient(50% 60% at 88% 12%,color-mix(in srgb,var(--mp-accent) 26%,transparent),transparent 70%),
    radial-gradient(40% 45% at 6% 100%,rgba(45,138,133,.2),transparent 70%)}
  .mp-hero:not(.has-cover)::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(240,237,232,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(240,237,232,.035) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(75% 70% at 75% 30%,#000,transparent);mask-image:radial-gradient(75% 70% at 75% 30%,#000,transparent)}
  .mp-hero .mp-wrap{position:relative;z-index:1;padding-top:44px;padding-bottom:40px}
  .mp-logo{width:68px;height:68px;border-radius:18px;background:var(--mp-accent) center/cover no-repeat;color:var(--mp-accent-ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:1.9rem;box-shadow:0 14px 36px -10px rgba(0,0,0,.55),0 0 0 1px rgba(240,237,232,.14)}
  .mp-eyebrow{font-family:var(--mono);font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--mp-accent-hi);margin:24px 0 0;display:flex;align-items:center;gap:12px}
  .mp-eyebrow::before{content:"";width:28px;height:1px;background:currentColor;flex:none}
  .mp-name{font-family:var(--display);font-weight:300;font-size:clamp(2.4rem,10.5vw,4.2rem);line-height:1.02;margin:14px 0 0;letter-spacing:-.02em;overflow-wrap:anywhere}
  .mp-name em,.mp-off h1 em{font-style:italic;font-weight:400;color:var(--mp-accent-hi)}
  .mp-bio{color:var(--on-ink-dim);font-size:1rem;line-height:1.65;margin:16px 0 0;max-width:52ch}
  .mp-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
  .mp-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;font:600 .9rem var(--body);text-decoration:none;cursor:pointer;border:1px solid transparent;transition:transform .15s ease,background .15s ease,box-shadow .15s ease}
  .mp-btn:active{transform:scale(.98)}
  .mp-btn svg{width:17px;height:17px;flex:none}
  .mp-btn-main{background:var(--mp-accent);color:var(--mp-accent-ink);box-shadow:0 10px 26px -12px color-mix(in srgb,var(--mp-accent) 80%,transparent)}
  .mp-btn-ghost{background:rgba(240,237,232,.06);border-color:rgba(240,237,232,.18);color:var(--on-ink)}
  .mp-btn-ghost:hover{background:rgba(240,237,232,.12)}
  .mp-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;padding:0;list-style:none}
  .mp-tags li{font-size:.76rem;color:var(--on-ink-dim);border:1px solid rgba(240,237,232,.16);border-radius:999px;padding:5px 12px}
  .mp-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:30px;padding-top:22px;border-top:1px solid rgba(240,237,232,.1);max-width:520px}
  .mp-stats b{display:block;font-family:var(--display);font-weight:300;font-size:clamp(1.7rem,7vw,2.3rem);line-height:1;color:var(--mp-accent-hi)}
  .mp-stats span{display:block;font-size:.74rem;color:var(--on-ink-dim);margin-top:6px;line-height:1.35}
  @media (min-width:900px){.mp-hero .mp-wrap{padding-top:72px;padding-bottom:64px}}

  /* listing area */
  .mp-list{padding:36px 0 64px}
  .mp-list-head{margin-bottom:18px}
  .mp-kicker{font-family:var(--mono);font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--on-sand-light);display:flex;align-items:center;gap:12px}
  .mp-kicker::before{content:"";width:28px;height:1px;background:currentColor;flex:none}
  .mp-list-head h2{font-family:var(--display);font-weight:300;font-size:clamp(1.7rem,6.4vw,2.4rem);line-height:1.08;letter-spacing:-.015em;margin:10px 0 0;color:var(--ink)}
  .mp-list-head h2 em{font-style:italic;font-weight:400;color:var(--sea-deep)}
  .mp-seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--sand);border-radius:999px;padding:4px;flex:none}
  .mp-seg .mp-chip{border:0;background:none;min-height:38px;padding:8px 16px}
  .mp-seg .mp-chip.on{background:var(--white);color:var(--ink);box-shadow:var(--shadow-sm)}
  .mp-filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:18px}
  .mp-filters::-webkit-scrollbar{display:none}
  .mp-chip{flex:none;border:1px solid var(--line);background:var(--white);color:var(--on-sand);font:500 .82rem var(--body);padding:9px 15px;border-radius:999px;cursor:pointer;min-height:40px}
  .mp-chip.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
  .mp-grid{display:grid;gap:16px;grid-template-columns:1fr}
  @media (min-width:700px){.mp-grid{grid-template-columns:repeat(2,1fr)}}
  @media (min-width:1040px){.mp-grid{grid-template-columns:repeat(3,1fr)}}

  .mp-card{background:var(--white);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-sm);transition:box-shadow .2s ease,transform .2s ease}
  .mp-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
  .mp-card-open{all:unset;cursor:pointer;display:block}
  .mp-card-open:focus-visible{outline:2px solid var(--mp-accent);outline-offset:-2px}
  .mp-photo{aspect-ratio:4/3;background:var(--sand-2) center/cover no-repeat;position:relative}
  .mp-photo.is-empty{aspect-ratio:16/7;background:linear-gradient(135deg,var(--sand),var(--sand-2));display:flex;align-items:center;justify-content:center}
  .mp-photo.is-empty svg{width:38px;height:38px;color:var(--on-sand-light);opacity:.5}
  .mp-badge{position:absolute;top:12px;left:12px;font:700 .58rem var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:5px 10px;border-radius:7px;background:rgba(10,22,40,.82);color:#fff}
  .mp-badge.rent{background:var(--mp-accent);color:var(--mp-accent-ink)}
  .mp-count{position:absolute;bottom:10px;right:10px;font:600 .68rem var(--body);background:rgba(10,22,40,.7);color:#fff;padding:4px 9px;border-radius:999px;display:flex;gap:5px;align-items:center}
  .mp-count svg{width:12px;height:12px}
  .mp-body{padding:16px 18px 6px}
  .mp-loc{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--on-sand-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mp-title{font-family:var(--display);font-weight:400;font-size:1.18rem;line-height:1.25;margin:6px 0 0;color:var(--ink)}
  .mp-specs{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:.82rem;color:var(--on-sand)}
  .mp-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px 16px;margin-top:auto}
  .mp-price{font-family:var(--mono);font-weight:700;font-size:1.02rem;color:var(--ink);white-space:nowrap}
  .mp-price small{font-weight:400;font-size:.72rem;color:var(--on-sand-light)}
  .mp-interest{display:inline-flex;align-items:center;gap:6px;background:var(--mp-accent);color:var(--mp-accent-ink);font:600 .8rem var(--body);padding:10px 15px;border-radius:999px;text-decoration:none;white-space:nowrap;min-height:40px}
  .mp-interest svg{width:15px;height:15px}
  .mp-empty{text-align:center;color:var(--on-sand);padding:40px 16px;border:1px dashed var(--line);border-radius:18px;background:var(--white)}

  /* Services (mini_services, supabase/019): the catalog of a service business. Same paper cards as the properties,
     no photo required: many trades have none, so the title and the price carry the card. */
  .mp-svcs{padding:36px 0 8px}
  .mp-svcs + .mp-list{padding-top:28px}
  .mp-svc{background:var(--white);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-sm)}
  .mp-svc-img{aspect-ratio:16/9;background:var(--sand) center/cover no-repeat}
  .mp-svc .mp-body{padding:16px 18px 4px}
  .mp-svc-desc{color:var(--on-sand);font-size:.9rem;line-height:1.5;margin:8px 0 0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .mp-svc-desc.open{display:block;-webkit-line-clamp:unset}
  .mp-svc-open{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;margin-top:10px;color:var(--sea-deep);font:600 .84rem var(--body);min-height:32px}
  .mp-svc-open:focus-visible{outline:2px solid var(--mp-accent);outline-offset:2px;border-radius:4px}
  .mp-svc-open small{font:600 .7rem var(--body);color:var(--on-sand-light)}
  .mp-svc-head{all:unset;cursor:pointer;display:block}
  .mp-svc-head:focus-visible{outline:2px solid var(--mp-accent);outline-offset:2px;border-radius:6px}
  .mp-sheet-assets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:6px}
  .mp-svc-more{all:unset;cursor:pointer;color:var(--sea-deep);font:600 .8rem var(--body);margin-top:6px;display:inline-block}
  .mp-svc-more:focus-visible{outline:2px solid var(--mp-accent);outline-offset:2px;border-radius:4px}
  .mp-svc-meta{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;color:var(--on-sand-light);margin-top:8px}
  /* Material (mini_assets, supabase/020): the owner's infographics and PDFs. Tiles crop to the top of a tall
     infographic (where its title is); tap opens it full size. */
  .mp-assets{padding:28px 0 8px}
  .mp-assets-grid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
  @media (min-width:700px){.mp-assets-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (min-width:1040px){.mp-assets-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
  .mp-asset{all:unset;cursor:pointer;display:flex;flex-direction:column;background:var(--white);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm);text-decoration:none;color:var(--ink)}
  .mp-asset:focus-visible{outline:2px solid var(--mp-accent);outline-offset:2px}
  .mp-asset-img{aspect-ratio:4/5;background:var(--sand-2) top center/cover no-repeat}
  .mp-asset-pdf{aspect-ratio:4/5;background:linear-gradient(160deg,var(--sand),var(--sand-2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--on-sand)}
  .mp-asset-pdf svg{width:38px;height:38px}
  .mp-asset-pdf b{font:700 .66rem var(--mono);letter-spacing:.14em;background:#a23a24;color:#fff;padding:3px 8px;border-radius:6px}
  .mp-asset span{font-size:.82rem;line-height:1.3;padding:9px 11px 11px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
  .mp-asset-full{display:block;width:100%;height:auto;background:var(--sand-2)}
  .mp-price.quote{font-family:var(--body);font-weight:600;font-size:.9rem;color:var(--on-sand)}

  /* the property sheet */
  .mp-sheet{border:0;padding:0;margin:auto 0 0;width:100%;max-width:100%;max-height:94vh;border-radius:22px 22px 0 0;background:var(--paper);color:var(--ink);overflow:hidden}
  .mp-sheet::backdrop{background:rgba(10,22,40,.6)}
  @media (min-width:760px){.mp-sheet{margin:auto;max-width:720px;border-radius:22px;max-height:90vh}}
  .mp-sheet-in{display:flex;flex-direction:column;max-height:94vh}
  @media (min-width:760px){.mp-sheet-in{max-height:90vh}}
  .mp-sheet-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
  .mp-close{position:absolute;top:12px;right:12px;z-index:3;width:40px;height:40px;border-radius:50%;border:0;background:rgba(10,22,40,.72);color:#fff;font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .mp-gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:var(--sand-2)}
  .mp-gallery::-webkit-scrollbar{display:none}
  .mp-gallery img{flex:none;width:100%;aspect-ratio:4/3;object-fit:cover;scroll-snap-align:start}
  .mp-gallery-wrap{position:relative}
  .mp-gallery-n{position:absolute;bottom:12px;right:12px;font:600 .72rem var(--body);background:rgba(10,22,40,.7);color:#fff;padding:5px 10px;border-radius:999px}
  .mp-sheet-body{padding:20px 20px 8px}
  .mp-sheet-price{font-family:var(--mono);font-weight:700;font-size:1.4rem;margin-top:10px}
  .mp-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;margin:18px 0 0}
  .mp-fact{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .mp-fact span{display:block;font-family:var(--mono);font-size:.56rem;letter-spacing:.12em;text-transform:uppercase;color:var(--on-sand-light)}
  .mp-fact b{display:block;font-size:1rem;margin-top:3px}
  .mp-sheet h3{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--on-sand-light);font-weight:700;margin:22px 0 8px}
  .mp-feats{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:0}
  .mp-feats li{font-size:.82rem;background:var(--white);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
  .mp-desc{white-space:pre-line;line-height:1.65;color:var(--on-sand);font-size:.95rem;margin:0}
  .mp-sheet-bar{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--white)}
  .mp-sheet-bar .mp-btn{flex:1}
  .mp-btn-line{background:var(--white);border-color:var(--line);color:var(--ink);flex:0 0 auto !important}

  /* paused or missing: the same navy stage as the hero */
  .mp-off{flex:1;min-height:72vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:56px 20px}
  .mp-off .mp-wrap{max-width:560px}
  .mp-off .mp-logo{margin:0 auto 4px}
  .mp-off .mp-eyebrow{justify-content:center}
  .mp-off .mp-eyebrow::after{content:"";width:28px;height:1px;background:currentColor;flex:none}
  .mp-off h1{font-family:var(--display);font-weight:300;font-size:clamp(2rem,8vw,3rem);line-height:1.05;letter-spacing:-.015em;margin:14px 0 0}
  .mp-off p{color:var(--on-ink-dim);margin:14px auto 0;max-width:40ch;line-height:1.65}

  /* our footprint: one quiet line on a navy band that closes the page */
  .mp-foot-site{background:var(--ink);color:var(--on-ink-faint);padding:26px 0 calc(30px + env(safe-area-inset-bottom));font-size:.78rem;margin:0}
  .mp-foot-site .mp-wrap{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
  .mp-foot-mail{color:var(--on-ink-dim);text-decoration:underline;text-underline-offset:3px;word-break:break-all}
  .mp-made{display:inline-flex;align-items:center;gap:8px;color:var(--on-ink-dim);text-decoration:none;font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase}
  .mp-made svg{width:15px;height:15px;flex:none}
  .mp-made:hover{color:var(--on-ink)}

  /* preview: the owner's own page before it is paid. A ribbon in the bar and a publish bar at the bottom. */
  .mp-ribbon{background:var(--mp-accent);color:var(--mp-accent-ink);font:700 .6rem var(--mono);letter-spacing:.14em;text-transform:uppercase}
  .mp-ribbon .mp-wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:32px}
  .mp-ribbon a{color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
  .mp-publish{position:fixed;left:0;right:0;bottom:0;z-index:16;background:var(--white);border-top:1px solid var(--line);box-shadow:0 -14px 40px -18px rgba(10,22,40,.35);padding:12px 0 calc(12px + env(safe-area-inset-bottom))}
  .mp-publish .mp-wrap{display:flex;align-items:center;gap:12px;justify-content:space-between}
  .mp-publish p{margin:0;font-size:.8rem;line-height:1.4;color:var(--on-sand)}
  .mp-publish p b{display:block;color:var(--ink);font-size:.9rem}
  .mp-publish .mp-btn{flex:none;background:var(--ink);color:var(--on-ink);box-shadow:none}
  body.is-preview .mp-foot-site{padding-bottom:calc(104px + env(safe-area-inset-bottom))}
  @media (max-width:420px){.mp-publish p{font-size:.74rem}.mp-publish p b{font-size:.84rem}.mp-publish .mp-btn{padding:0 14px;font-size:.84rem}}

  /* sticky contact on phones, once the hero button has scrolled away */
  .mp-float{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:15;display:none}
  .mp-float.show{display:flex}
  .mp-float .mp-btn{flex:1;box-shadow:0 10px 30px rgba(10,22,40,.3)}
  @media (min-width:760px){.mp-float{display:none !important}}
  /* room under the footer so the floating button never covers it */
  @media (max-width:759px){body.has-float .mp-foot-site{padding-bottom:calc(92px + env(safe-area-inset-bottom))}}
</style>
</head>
<body data-page="page">

<div id="mp-root"></div>

<dialog class="mp-sheet" id="mp-sheet" aria-labelledby="mp-sheet-title">
  <div class="mp-sheet-in" id="mp-sheet-in"></div>
</dialog>

<script type="application/json" id="mp-data">__DATA__</script>
<script src="/js/escape.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/track.js"></script>
<script src="/js/business-types.js"></script>
<script>
(function () {
  'use strict';
  var data = {};
  try { data = JSON.parse(document.getElementById('mp-data').textContent) || {}; } catch (e) { data = { state: 'not_found' }; }
  var agency = data.agency || {};
  var listings = data.listings || [];
  var services = data.services || [];
  var assets = data.assets || [];
  var filter = { op: 'all', town: 'all' };
  var root = document.getElementById('mp-root');
  var PREVIEW = data.state === 'preview';
  var LIVE = data.state === 'active' || PREVIEW;
  var sheet = document.getElementById('mp-sheet');

  function isEn() { return document.documentElement.lang === 'en'; }
  function t(es, en) { return isEn() ? en : es; }
  function digits(s) { return String(s || '').replace(/[^0-9]/g, ''); }
  function title(p) { return (isEn() ? (p.title_en || p.title_es) : (p.title_es || p.title_en)) || t('Propiedad', 'Property'); }
  function photos(p) {
    var list = Array.isArray(p.images) ? p.images.slice() : [];
    if (p.image && list.indexOf(p.image) === -1) list.unshift(p.image);
    return list.filter(function (u) { return !!safeUrl(u); });
  }
  function money(p) {
    if (!p.amount) return t('Precio a consultar', 'Price on request');
    return (p.currency || 'MXN') + ' $' + Number(p.amount).toLocaleString('en-US');
  }
  function per(p) { return p.operation === 'rental' ? t('/mes', '/mo') : ''; }
  function specs(p) {
    return [p.bedrooms ? p.bedrooms + ' ' + t('rec', 'bd') : '', p.bathrooms ? p.bathrooms + ' ' + t('baños', 'bath') : '',
            p.size ? p.size + ' m²' : '', p.parking ? p.parking + ' ' + t('estac.', 'parking') : ''].filter(Boolean);
  }
  function features(p) {
    var f = Array.isArray(p.features) ? p.features : String(p.features || '').split(',');
    return f.map(function (x) { return String(x).trim(); }).filter(Boolean).slice(0, 16);
  }
  function pageLink(p) { return location.origin + '/' + encodeURIComponent(agency.slug || '') + (p ? '?p=' + encodeURIComponent(p.public_id) : ''); }
  function waLink(text) {
    var n = digits(agency.whatsapp_number);
    return n ? safeUrl('https://wa.me/' + n + '?text=' + encodeURIComponent(text)) : '';
  }
  function interestText(p) {
    return t('Hola, me interesa esta propiedad: ', 'Hi, I am interested in this property: ') + title(p) + ' (' + money(p) + ') ' + pageLink(p);
  }
  function icon(id) { return '<svg aria-hidden="true"><use href="#' + id + '"/></svg>'; }
  /* safeUrl() allows only http(s) and our own paths, so it drops a mailto: link (the email button never showed).
     The address was validated on save (api/_lib/listing-fields.js: no spaces, quotes or angle brackets), checked
     again here, and the whole href is escaped. */
  var EMAIL_OK = /^[^\s"'<>@]+@[^\s"'<>@]+\.[^\s"'<>@]+$/;
  function mailHref(addr) { return addr && EMAIL_OK.test(addr) ? escapeHtml('mailto:' + addr) : ''; }

  /* The business template (mini/js/business-types.js). A page with only properties keeps the original wording. */
  function type() { return (window.MINI_TYPES && MINI_TYPES.typeFor(agency.business_type)) || { key: 'real_estate', hasListings: true, eyebrow: ['Servicios', 'Services'], greeting: ['Hola, vi tu página y quiero más información.', 'Hi, I saw your page and would like more information.'] }; }
  function pair(p) { return isEn() ? p[1] : p[0]; }
  function propertiesOnly() { return !services.length && type().hasListings; }
  function greeting() {
    return propertiesOnly() ? t('Hola, vi tus propiedades en línea y quiero más información.', 'Hi, I saw your properties online and would like more information.') : pair(type().greeting);
  }
  /* Properties show when there are some, or on a real-estate page with nothing else yet ("coming soon"). */
  function showListings() { return listings.length > 0 || propertiesOnly(); }

  /* Brand colour: pick dark or light text by real WCAG contrast (same rule as PropLync's agency page). */
  var INK_DARK = '#0a1628', INK_LIGHT = '#f5f1ea';
  function lum(hex) {
    var h = String(hex).replace('#', '').slice(0, 6);
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    if (!/^[0-9a-f]{6}$/i.test(h)) return null;
    var c = function (v) { var x = parseInt(v, 16) / 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); };
    return 0.2126 * c(h.slice(0, 2)) + 0.7152 * c(h.slice(2, 4)) + 0.0722 * c(h.slice(4, 6));
  }
  function ratio(a, b) { var hi = Math.max(a, b), lo = Math.min(a, b); return (hi + 0.05) / (lo + 0.05); }
  function brand() {
    var L = agency.primary_color ? lum(agency.primary_color) : null;
    if (L === null) return;
    var s = document.documentElement.style;
    s.setProperty('--mp-accent', agency.primary_color);
    s.setProperty('--mp-accent-ink', ratio(L, lum(INK_DARK)) >= ratio(L, lum(INK_LIGHT)) ? INK_DARK : INK_LIGHT);
    if (ratio(L, lum(INK_DARK)) < 4.5) s.setProperty('--mp-accent-hi', 'color-mix(in srgb, ' + agency.primary_color + ' 45%, ' + INK_LIGHT + ')');
  }

  /* The last word in italics and the accent colour, the landing headline's signature. One word stays plain. */
  function nameHTML(name) {
    var words = String(name || '').trim().split(/\s+/);
    if (words.length < 2) return escapeHtml(words[0] || '');
    var last = words.pop();
    return escapeHtml(words.join(' ')) + ' <em>' + escapeHtml(last) + '</em>';
  }

  function markHTML(cls) {
    var logo = cssUrl(agency.logo_url);
    var initial = escapeHtml((agency.name || '?').trim().charAt(0).toUpperCase());
    return '<div class="' + cls + '"' + (logo ? ' style="background-image:url(\'' + logo + '\')"' : '') + '>' + (logo ? '' : initial) + '</div>';
  }

  function barHTML() {
    return '<header class="mp-bar">' +
      (PREVIEW ? '<div class="mp-ribbon"><div class="mp-wrap"><span>' + escapeHtml(t('Vista previa · aún no es pública', 'Preview · not public yet')) + '</span>' +
        '<a href="/panel">' + escapeHtml(t('Volver al panel', 'Back to panel')) + '</a></div></div>' : '') +
      '<div class="mp-wrap">' +
      '<a class="mp-brand" href="' + escapeHtml(PREVIEW ? location.pathname + location.search : pageLink()) + '">' + markHTML('mp-mark') + '<b>' + escapeHtml(agency.name || 'PropLync Mini') + '</b></a>' +
      '<div class="mp-lang" role="group" aria-label="Language"><button id="es" type="button">ES</button><button id="en" type="button">EN</button></div>' +
      '</div></header>';
  }
  function footHTML() {
    var mail = LIVE ? mailHref(agency.public_email) : '';
    return '<footer class="mp-foot-site"><div class="mp-wrap"><span>© ' + new Date().getFullYear() + ' ' + escapeHtml(agency.name || 'PropLync Mini') +
      (mail ? ' · <a class="mp-foot-mail" href="' + mail + '">' + escapeHtml(agency.public_email) + '</a>' : '') + '</span>' +
      '<a class="mp-made" href="/?ref=badge"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.2l12.4 6.4v9.2c0 7.4-5.3 11.9-12.4 14-7.1-2.1-12.4-6.6-12.4-14V8.6L16 2.2z" fill="#c9a96e"/><path d="M10.6 18.4L16 13.2l5.4 5.2" stroke="#0a1628" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        escapeHtml(t('Hecho con PropLync Mini · Crea la tuya', 'Made with PropLync Mini · Make yours')) + '</a></div></footer>';
  }

  function heroHTML() {
    var cover = cssUrl(agency.cover_url);
    var wa = waLink(greeting());
    var tel = digits(agency.phone);
    var mail = mailHref(agency.public_email);
    var map = agency.maps_url ? safeUrl(agency.maps_url) : (agency.address ? safeUrl('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(agency.address)) : '');
    var towns = [];
    listings.forEach(function (p) { if (p.town && towns.indexOf(p.town) === -1) towns.push(p.town); });
    var ops = { sale: 0, rental: 0 };
    listings.forEach(function (p) { ops[p.operation === 'rental' ? 'rental' : 'sale']++; });
    function stat(n, label) { return '<div><b>' + n + '</b><span>' + escapeHtml(label) + '</span></div>'; }
    var stats = [stat(listings.length, listings.length === 1 ? t('propiedad', 'property') : t('propiedades', 'properties'))];
    if (ops.sale && ops.rental) {
      stats.push(stat(ops.sale, t('en venta', 'for sale')));
      stats.push(stat(ops.rental, t('en renta', 'for rent')));
    } else {
      if (ops.sale || ops.rental) stats.push(stat(ops.sale || ops.rental, ops.rental ? t('en renta', 'for rent') : t('en venta', 'for sale')));
      if (towns.length) stats.push(stat(towns.length, towns.length === 1 ? towns[0] : t('zonas', 'areas')));
    }
    var shade = 'linear-gradient(180deg,rgba(10,22,40,.6),rgba(10,22,40,.94))';
    return '<section class="mp-hero' + (cover ? ' has-cover' : '') + '"' + (cover ? ' style="background-image:' + shade + ',url(\'' + cover + '\')"' : '') + '><div class="mp-wrap">' +
      markHTML('mp-logo') +
      '<div class="mp-eyebrow">' + escapeHtml(propertiesOnly() ? t('Portafolio de propiedades', 'Property portfolio') : pair(type().eyebrow)) + '</div>' +
      '<h1 class="mp-name">' + nameHTML(agency.name) + '</h1>' +
      (agency.bio ? '<p class="mp-bio">' + escapeHtml(agency.bio) + '</p>' : '') +
      '<div class="mp-actions" id="mp-hero-actions">' +
        (wa ? '<a class="mp-btn mp-btn-main" href="' + wa + '" target="_blank" rel="noopener">' + icon('i-wa') + escapeHtml(t('Escribir por WhatsApp', 'Message on WhatsApp')) + '</a>' : '') +
        (tel ? '<a class="mp-btn mp-btn-ghost" href="tel:' + tel + '">' + icon('i-phone') + escapeHtml(t('Llamar', 'Call')) + '</a>' : '') +
        (mail ? '<a class="mp-btn mp-btn-ghost" href="' + mail + '">' + icon('i-mail') + escapeHtml(t('Correo', 'Email')) + '</a>' : '') +
        (map ? '<a class="mp-btn mp-btn-ghost" href="' + map + '" target="_blank" rel="noopener">' + icon('i-pin') + escapeHtml(t('Ubicación', 'Location')) + '</a>' : '') +
      '</div>' +
      ((agency.services || []).length ? '<ul class="mp-tags">' + agency.services.slice(0, 8).map(function (s) { return '<li>' + escapeHtml(s) + '</li>'; }).join('') + '</ul>' : '') +
      (listings.length ? '<div class="mp-stats">' + stats.join('') + '</div>' : '') +
      '</div></section>';
  }

  function cardHTML(p) {
    var ph = photos(p), cover = ph.length ? cssUrl(ph[0]) : '';
    var wa = waLink(interestText(p));
    var sp = specs(p).map(function (s) { return '<span>' + escapeHtml(s) + '</span>'; }).join('');
    return '<article class="mp-card">' +
      '<button class="mp-card-open" type="button" data-open="' + escapeHtml(p.public_id) + '" aria-label="' + escapeHtml(t('Ver detalles: ', 'View details: ') + title(p)) + '">' +
        '<div class="mp-photo' + (cover ? '' : ' is-empty') + '"' + (cover ? ' style="background-image:url(\'' + cover + '\')"' : '') + '>' +
          (cover ? '' : icon('i-home')) +
          '<span class="mp-badge' + (p.operation === 'rental' ? ' rent' : '') + '">' + escapeHtml(p.operation === 'rental' ? t('Renta', 'Rent') : t('Venta', 'Sale')) + '</span>' +
          (ph.length > 1 ? '<span class="mp-count">' + icon('i-cam') + ph.length + '</span>' : '') +
        '</div>' +
        '<div class="mp-body"><div class="mp-loc">' + escapeHtml([p.neighborhood, p.town].filter(Boolean).join(' · ') || ' ') + '</div>' +
        '<h2 class="mp-title">' + escapeHtml(title(p)) + '</h2>' +
        (sp ? '<div class="mp-specs">' + sp + '</div>' : '') +
        '<span class="mp-svc-open" aria-hidden="true">' + escapeHtml(t('Ver detalles', 'See details')) + ' →</span></div>' +
      '</button>' +
      '<div class="mp-foot"><span class="mp-price">' + escapeHtml(money(p)) + (p.amount && per(p) ? ' <small>' + escapeHtml(per(p)) + '</small>' : '') + '</span>' +
        (wa ? '<a class="mp-interest" href="' + wa + '" target="_blank" rel="noopener">' + icon('i-wa') + escapeHtml(t('Me interesa', 'I\'m interested')) + '</a>' : '') +
      '</div></article>';
  }

  function svcTitle(x) { return (isEn() ? (x.title_en || x.title_es) : (x.title_es || x.title_en)) || ''; }
  function svcDesc(x) { return (isEn() ? (x.description_en || x.description_es) : (x.description_es || x.description_en)) || ''; }
  function svcPrice(x) {
    if (x.price_kind === 'quote' || x.price == null) return '';
    var n = (x.currency || 'MXN') + ' $' + Number(x.price).toLocaleString('en-US');
    if (x.price_kind === 'from') return t('Desde ', 'From ') + n;
    if (x.price_kind === 'per_m2') return n + ' ' + t('por m²', 'per m²');
    return n;
  }
  function svcDuration(x) {
    var m = Number(x.duration_min);
    if (!m) return '';
    return m < 60 ? m + ' min' : (m % 60 ? Math.floor(m / 60) + ' h ' + (m % 60) + ' min' : (m / 60) + ' h');
  }
  function svcLink(x) { return location.origin + '/' + encodeURIComponent(agency.slug || '') + '?s=' + encodeURIComponent(x.id); }
  function svcWa(x) {
    var price = svcPrice(x);
    return waLink(t('Hola, me interesa este servicio: ', 'Hi, I am interested in this service: ') + svcTitle(x) + (price ? ' (' + price + ')' : '') + ' ' + svcLink(x));
  }
  /* The owner's material linked to this service (mini_assets.service_id). */
  function svcAssets(x) { return assets.filter(function (a) { return a.service_id === x.id && safeUrl(a.url); }); }
  function svcCardHTML(x) {
    var img = cssUrl(x.image), price = svcPrice(x), desc = svcDesc(x), dur = svcDuration(x);
    var wa = svcWa(x), n = svcAssets(x).length;
    return '<article class="mp-svc">' +
      (img ? '<div class="mp-svc-img" style="background-image:url(\'' + img + '\')" role="img" aria-label="' + escapeHtml(svcTitle(x)) + '"></div>' : '') +
      '<div class="mp-body"><button class="mp-svc-head" type="button" data-svc-open="' + escapeHtml(x.id) + '"><h3 class="mp-title">' + escapeHtml(svcTitle(x)) + '</h3></button>' +
        (desc ? '<p class="mp-svc-desc">' + escapeHtml(desc) + '</p>' : '') +
        (dur ? '<div class="mp-svc-meta">' + escapeHtml(dur) + '</div>' : '') +
        '<button class="mp-svc-open" type="button" data-svc-open="' + escapeHtml(x.id) + '">' + escapeHtml(t('Ver detalles', 'See details')) + ' →' +
          (n ? ' <small>· ' + escapeHtml(n + ' ' + (n === 1 ? t('archivo', 'file') : t('archivos', 'files'))) + '</small>' : '') + '</button>' +
      '</div>' +
      '<div class="mp-foot"><span class="mp-price' + (price ? '' : ' quote') + '">' + escapeHtml(price || t('Precio a cotizar', 'Price on request')) + '</span>' +
        (wa ? '<a class="mp-interest" href="' + wa + '" target="_blank" rel="noopener">' + icon('i-wa') + escapeHtml(t('Pedir', 'Ask')) + '</a>' : '') +
      '</div></article>';
  }
  function servicesHTML() {
    if (!services.length) return '';
    return '<section class="mp-svcs" aria-labelledby="mp-svcs-h"><div class="mp-wrap">' +
      '<div class="mp-list-head"><div class="mp-kicker">' + escapeHtml(services.length + ' ' + (services.length === 1 ? t('servicio', 'service') : t('servicios', 'services'))) + '</div>' +
      '<h2 id="mp-svcs-h">' + escapeHtml(t('Lo que', 'What')) + ' <em>' + escapeHtml(t('ofrezco', 'I offer')) + '</em></h2></div>' +
      '<div class="mp-grid">' + services.map(svcCardHTML).join('') + '</div>' +
      '</div></section>';
  }

  function assetTitle(x, i) { return x.title || (x.kind === 'pdf' ? t('Documento ', 'Document ') : t('Imagen ', 'Image ')) + (i + 1); }
  function assetsHTML() {
    var list = assets.filter(function (x) { return safeUrl(x.url); });
    if (!list.length) return '';
    return '<section class="mp-assets" aria-labelledby="mp-assets-h"><div class="mp-wrap">' +
      '<div class="mp-list-head"><div class="mp-kicker">' + escapeHtml(list.length + ' ' + (list.length === 1 ? t('archivo', 'file') : t('archivos', 'files'))) + '</div>' +
      '<h2 id="mp-assets-h">' + escapeHtml(t('Material e', 'Material and')) + ' <em>' + escapeHtml(t('información', 'information')) + '</em></h2></div>' +
      '<div class="mp-assets-grid">' + list.map(function (x, i) {
        var label = assetTitle(x, i);
        if (x.kind === 'pdf') {
          return '<a class="mp-asset" href="' + safeUrl(x.url) + '" target="_blank" rel="noopener" data-asset-pdf="' + escapeHtml(x.id) + '">' +
            '<div class="mp-asset-pdf">' + icon('i-doc') + '<b>PDF</b></div><span>' + escapeHtml(label) + '</span></a>';
        }
        return '<button class="mp-asset" type="button" data-asset="' + escapeHtml(x.id) + '" aria-label="' + escapeHtml(t('Ver: ', 'View: ') + label) + '">' +
          '<div class="mp-asset-img" style="background-image:url(\'' + cssUrl(x.url) + '\')"></div><span>' + escapeHtml(label) + '</span></button>';
      }).join('') + '</div></div></section>';
  }
  /* One service in detail: photo, full description, price, duration, its material, ask on WhatsApp, share its link. */
  function openService(id) {
    var x = services.filter(function (v) { return v.id === id; })[0];
    if (!x) return;
    var img = safeUrl(x.image), price = svcPrice(x), desc = svcDesc(x), dur = svcDuration(x), wa = svcWa(x), mats = svcAssets(x);
    var facts = [[t('Precio', 'Price'), price || t('A cotizar', 'On request')]];
    if (dur) facts.push([t('Duración', 'Duration'), dur]);
    document.getElementById('mp-sheet-in').innerHTML =
      '<div class="mp-sheet-scroll" style="position:relative">' +
        '<button class="mp-close" type="button" id="mp-close" aria-label="' + escapeHtml(t('Cerrar', 'Close')) + '">×</button>' +
        (img ? '<img class="mp-asset-full" src="' + img + '" alt="' + escapeHtml(svcTitle(x)) + '">' : '<div style="height:56px"></div>') +
        '<div class="mp-sheet-body">' +
          '<div class="mp-loc">' + escapeHtml(pair(type().eyebrow)) + '</div>' +
          '<h2 class="mp-title" id="mp-sheet-title" style="font-size:1.45rem">' + escapeHtml(svcTitle(x)) + '</h2>' +
          '<div class="mp-facts">' + facts.map(function (f) { return '<div class="mp-fact"><span>' + escapeHtml(f[0]) + '</span><b>' + escapeHtml(f[1]) + '</b></div>'; }).join('') + '</div>' +
          (desc ? '<h3>' + escapeHtml(t('Descripción', 'Description')) + '</h3><p class="mp-desc">' + escapeHtml(desc) + '</p>'
                : '<p class="mp-desc" style="margin-top:16px">' + escapeHtml(t('Escríbenos por WhatsApp y te damos todos los detalles de este servicio.', 'Message us on WhatsApp and we will give you all the details of this service.')) + '</p>') +
          (mats.length ? '<h3>' + escapeHtml(t('Material de este servicio', 'Material for this service')) + '</h3><div class="mp-sheet-assets">' + mats.map(function (a, i) {
            var label = assetTitle(a, i);
            return a.kind === 'pdf'
              ? '<a class="mp-asset" href="' + safeUrl(a.url) + '" target="_blank" rel="noopener"><div class="mp-asset-pdf">' + icon('i-doc') + '<b>PDF</b></div><span>' + escapeHtml(label) + '</span></a>'
              : '<button class="mp-asset" type="button" data-asset="' + escapeHtml(a.id) + '"><div class="mp-asset-img" style="background-image:url(\'' + cssUrl(a.url) + '\')"></div><span>' + escapeHtml(label) + '</span></button>';
          }).join('') + '</div>' : '') +
        '</div>' +
      '</div>' +
      '<div class="mp-sheet-bar">' +
        (wa ? '<a class="mp-btn mp-btn-main" href="' + wa + '" target="_blank" rel="noopener">' + icon('i-wa') + escapeHtml(t('Pedir este servicio', 'Ask for this service')) + '</a>' : '') +
        (PREVIEW ? '' : '<button class="mp-btn mp-btn-line" type="button" id="mp-share" aria-label="' + escapeHtml(t('Compartir', 'Share')) + '">' + icon('i-share') + '</button>') +
      '</div>';
    document.getElementById('mp-close').onclick = closeSheet;
    var sh = document.getElementById('mp-share');
    if (sh) sh.onclick = function () {
      var url = svcLink(x), btn = this;
      if (navigator.share) { navigator.share({ title: svcTitle(x), text: svcTitle(x) + ' · ' + (agency.name || ''), url: url }).catch(function () {}); return; }
      if (navigator.clipboard) navigator.clipboard.writeText(url).then(function () { btn.textContent = t('Copiado', 'Copied'); }).catch(function () {});
    };
    if (typeof sheet.showModal === 'function') { if (!sheet.open) sheet.showModal(); } else sheet.setAttribute('open', '');
    setParam('s', x.id);
    if (data.state === 'active') miniTrack('mini_service_open', { slug: agency.slug });
  }

  /* Full size in the bottom sheet: an infographic is read by scrolling down it. Download and WhatsApp share. */
  function openAsset(id) {
    var i = -1;
    assets.forEach(function (x, k) { if (x.id === id) i = k; });
    var x = assets[i];
    if (!x || x.kind !== 'image' || !safeUrl(x.url)) return;
    var label = assetTitle(x, i);
    var share = safeUrl('https://wa.me/?text=' + encodeURIComponent(label + ' · ' + (agency.name || '') + ' ' + x.url));
    document.getElementById('mp-sheet-in').innerHTML =
      '<div class="mp-sheet-scroll" style="position:relative">' +
        '<button class="mp-close" type="button" id="mp-close" aria-label="' + escapeHtml(t('Cerrar', 'Close')) + '">×</button>' +
        '<img class="mp-asset-full" src="' + safeUrl(x.url) + '" alt="' + escapeHtml(label) + '">' +
        '<div class="mp-sheet-body"><h2 class="mp-title" id="mp-sheet-title" style="font-size:1.2rem">' + escapeHtml(label) + '</h2></div>' +
      '</div>' +
      '<div class="mp-sheet-bar">' +
        (PREVIEW ? '' : '<a class="mp-btn mp-btn-main" href="' + share + '" target="_blank" rel="noopener" data-share-asset>' + icon('i-wa') + escapeHtml(t('Compartir', 'Share')) + '</a>') +
        '<a class="mp-btn mp-btn-line" href="' + safeUrl(x.url) + '" target="_blank" rel="noopener" download aria-label="' + escapeHtml(t('Descargar', 'Download')) + '">' + icon('i-down') + '</a>' +
      '</div>';
    document.getElementById('mp-close').onclick = closeSheet;
    if (typeof sheet.showModal === 'function') { if (!sheet.open) sheet.showModal(); } else sheet.setAttribute('open', '');
    if (data.state === 'active') miniTrack('mini_asset_open', { slug: agency.slug });
  }

  function visible() {
    return listings.filter(function (p) {
      var op = p.operation === 'rental' ? 'rental' : 'sale';
      return (filter.op === 'all' || filter.op === op) && (filter.town === 'all' || filter.town === p.town);
    });
  }

  function filtersHTML() {
    var hasSale = listings.some(function (p) { return p.operation !== 'rental'; });
    var hasRent = listings.some(function (p) { return p.operation === 'rental'; });
    var towns = [];
    listings.forEach(function (p) { if (p.town && towns.indexOf(p.town) === -1) towns.push(p.town); });
    var chips = [];
    if (hasSale && hasRent) {
      chips.push('<span class="mp-seg">' + [['all', t('Todas', 'All')], ['sale', t('Venta', 'Sale')], ['rental', t('Renta', 'Rent')]].map(function (o) {
        return '<button type="button" class="mp-chip' + (filter.op === o[0] ? ' on' : '') + '" data-op="' + o[0] + '" aria-pressed="' + (filter.op === o[0]) + '">' + escapeHtml(o[1]) + '</button>';
      }).join('') + '</span>');
    }
    if (towns.length > 1) {
      chips.push('<button type="button" class="mp-chip' + (filter.town === 'all' ? ' on' : '') + '" data-town="all" aria-pressed="' + (filter.town === 'all') + '">' + escapeHtml(t('Todas las zonas', 'All areas')) + '</button>');
      towns.forEach(function (tw) {
        chips.push('<button type="button" class="mp-chip' + (filter.town === tw ? ' on' : '') + '" data-town="' + escapeHtml(tw) + '" aria-pressed="' + (filter.town === tw) + '">' + escapeHtml(tw) + '</button>');
      });
    }
    return chips.length ? '<div class="mp-filters" role="toolbar" aria-label="' + escapeHtml(t('Filtrar', 'Filter')) + '">' + chips.join('') + '</div>' : '';
  }

  function listHTML() {
    var v = visible();
    var towns = [];
    listings.forEach(function (p) { if (p.town && towns.indexOf(p.town) === -1) towns.push(p.town); });
    var kicker = listings.length + ' ' + (listings.length === 1 ? t('propiedad', 'property') : t('propiedades', 'properties')) +
      (towns.length ? ' · ' + towns.slice(0, 3).join(' · ') : '');
    return '<main class="mp-list"><div class="mp-wrap">' +
      '<div class="mp-list-head"><div class="mp-kicker">' + escapeHtml(kicker) + '</div>' +
      '<h2>' + escapeHtml(t('Propiedades', 'Available')) + ' <em>' + escapeHtml(t('disponibles', 'properties')) + '</em></h2></div>' +
      filtersHTML() +
      (v.length ? '<div class="mp-grid">' + v.map(cardHTML).join('') + '</div>'
        : '<div class="mp-empty">' + escapeHtml(listings.length ? t('No hay propiedades con ese filtro.', 'No properties match that filter.') : t('Pronto habrá propiedades aquí.', 'Properties are coming soon.')) + '</div>') +
      '</div></main>';
  }

  function offHTML(eyebrow, heading, body, action) {
    return '<main class="mp-hero mp-off"><div class="mp-wrap">' + (agency.name ? markHTML('mp-logo') : '') +
      '<div class="mp-eyebrow">' + escapeHtml(eyebrow) + '</div>' +
      '<h1>' + heading + '</h1>' + (body ? '<p>' + escapeHtml(body) + '</p>' : '') +
      (action ? '<div class="mp-actions" style="justify-content:center">' + action + '</div>' : '') + '</div></main>';
  }

  function publishHTML() {
    var price = data.publish && data.publish.price;
    var noWa = !digits(agency.whatsapp_number);
    return '<div class="mp-publish" role="region" aria-label="' + escapeHtml(t('Publicar', 'Publish')) + '"><div class="mp-wrap">' +
      '<p><b>' + escapeHtml(t('Así la verán tus clientes', 'This is what your clients will see')) + '</b>' +
      escapeHtml(noWa ? t('Agrega tu WhatsApp en el panel para mostrar el botón «Me interesa».', 'Add your WhatsApp in the panel to show the “I\'m interested” button.')
                      : t('Se publica en cuanto confirmemos tu pago.', 'It goes live as soon as we confirm your payment.')) + '</p>' +
      '<a class="mp-btn" href="/panel?pay=1">' + escapeHtml(t('Publicar', 'Publish') + (price ? ' · MXN ' + price : '')) + '</a>' +
      '</div></div>';
  }

  function render() {
    var html;
    if (LIVE) html = barHTML() + heroHTML() + servicesHTML() + assetsHTML() + (showListings() ? listHTML() : '') + footHTML() + (PREVIEW ? publishHTML() : '');
    else if (data.state === 'preview_loading') html = offHTML(t('Vista previa', 'Preview'), escapeHtml(t('Cargando…', 'Loading…')), '');
    else if (data.state === 'preview_private') html = offHTML(t('Vista previa privada', 'Private preview'),
      escapeHtml(t('Esta vista previa es', 'This preview is')) + ' <em>' + escapeHtml(t('privada', 'private')) + '</em>',
      t('Solo la ve el dueño de la página, con su sesión iniciada. Cuando la página se publique, la verás en su link.', 'Only the page owner can see it, signed in. Once the page is published you will see it at its link.'),
      '<a class="mp-btn mp-btn-main" href="/panel?preview=1">' + escapeHtml(t('Soy el dueño · Entrar', 'I am the owner · Sign in')) + '</a>') + footHTML();
    else if (data.state === 'paused') html = barHTML() + offHTML(t('Página en pausa', 'Page paused'), nameHTML(agency.name), t('Esta página no está disponible por ahora. Si buscas a este asesor, escríbele directamente.', 'This page is not available right now. If you are looking for this agent, contact them directly.')) + footHTML();
    else html = offHTML('PropLync Mini', escapeHtml(t('Página no encontrada', 'Page not found')), t('Esta página no existe o cambió de dirección. Revisa el link que te compartieron.', 'This page does not exist or has moved. Check the link you were sent.')) + footHTML();
    root.innerHTML = html;
    var es = document.getElementById('es'), en = document.getElementById('en');
    if (es) { es.classList.toggle('on', !isEn()); en.classList.toggle('on', isEn()); es.onclick = function () { setLang('es'); }; en.onclick = function () { setLang('en'); }; }
    var wa = waLink(greeting());
    document.body.classList.toggle('is-preview', PREVIEW);
    var floatHTML = data.state === 'active' && wa
      ? '<a class="mp-btn mp-btn-main" href="' + wa + '" target="_blank" rel="noopener">' + icon('i-wa') + escapeHtml(t('Escribir por WhatsApp', 'Message on WhatsApp')) + '</a>' : '';
    document.getElementById('mp-float').innerHTML = floatHTML;
    document.body.classList.toggle('has-float', !!floatHTML);
  }

  function openSheet(id) {
    var p = listings.filter(function (x) { return x.public_id === id; })[0];
    if (!p) return;
    var ph = photos(p);
    var wa = waLink(interestText(p));
    var desc = isEn() ? (p.description_en || p.description_es) : (p.description_es || p.description_en);
    var facts = [[t('Operación', 'Type'), p.operation === 'rental' ? t('Renta', 'Rent') : t('Venta', 'Sale')]];
    if (p.bedrooms) facts.push([t('Recámaras', 'Bedrooms'), p.bedrooms]);
    if (p.bathrooms) facts.push([t('Baños', 'Bathrooms'), p.bathrooms]);
    if (p.size) facts.push([t('Construcción', 'Built area'), p.size + ' m²']);
    if (p.parking) facts.push([t('Estacionamiento', 'Parking'), p.parking]);
    var feats = features(p);
    document.getElementById('mp-sheet-in').innerHTML =
      '<div class="mp-sheet-scroll"><div class="mp-gallery-wrap">' +
        '<button class="mp-close" type="button" id="mp-close" aria-label="' + escapeHtml(t('Cerrar', 'Close')) + '">×</button>' +
        (ph.length ? '<div class="mp-gallery" id="mp-gallery">' + ph.map(function (u, i) { return '<img src="' + safeUrl(u) + '" alt="' + escapeHtml(title(p) + ' · ' + (i + 1)) + '"' + (i ? ' loading="lazy"' : '') + '>'; }).join('') + '</div>' +
          (ph.length > 1 ? '<span class="mp-gallery-n" id="mp-gallery-n">1 / ' + ph.length + '</span>' : '')
          : '<div class="mp-photo is-empty">' + icon('i-home') + '</div>') +
      '</div><div class="mp-sheet-body">' +
        '<div class="mp-loc">' + escapeHtml([p.neighborhood, p.town].filter(Boolean).join(' · ')) + '</div>' +
        '<h2 class="mp-title" id="mp-sheet-title" style="font-size:1.5rem">' + escapeHtml(title(p)) + '</h2>' +
        '<div class="mp-sheet-price">' + escapeHtml(money(p)) + (p.amount && per(p) ? ' <small style="font-size:.8rem;font-weight:400">' + escapeHtml(per(p)) + '</small>' : '') + '</div>' +
        '<div class="mp-facts">' + facts.map(function (f) { return '<div class="mp-fact"><span>' + escapeHtml(f[0]) + '</span><b>' + escapeHtml(String(f[1])) + '</b></div>'; }).join('') + '</div>' +
        (feats.length ? '<h3>' + escapeHtml(t('Amenidades', 'Features')) + '</h3><ul class="mp-feats">' + feats.map(function (f) { return '<li>' + escapeHtml(f) + '</li>'; }).join('') + '</ul>' : '') +
        (desc ? '<h3>' + escapeHtml(t('Descripción', 'Description')) + '</h3><p class="mp-desc">' + escapeHtml(desc) + '</p>' : '') +
      '</div></div>' +
      '<div class="mp-sheet-bar">' +
        (wa ? '<a class="mp-btn mp-btn-main" href="' + wa + '" target="_blank" rel="noopener">' + icon('i-wa') + escapeHtml(t('Me interesa', 'I\'m interested')) + '</a>' : '') +
        (PREVIEW ? '' : '<button class="mp-btn mp-btn-line" type="button" id="mp-share" aria-label="' + escapeHtml(t('Compartir', 'Share')) + '">' + icon('i-share') + '</button>') +
      '</div>';
    document.getElementById('mp-close').onclick = closeSheet;
    var sh = document.getElementById('mp-share');
    if (sh) sh.onclick = function () { share(p, this); };
    var g = document.getElementById('mp-gallery'), n = document.getElementById('mp-gallery-n');
    if (g && n) g.addEventListener('scroll', function () { n.textContent = (Math.round(g.scrollLeft / g.clientWidth) + 1) + ' / ' + ph.length; }, { passive: true });
    if (typeof sheet.showModal === 'function') { if (!sheet.open) sheet.showModal(); } else sheet.setAttribute('open', '');
    setFocus(p.public_id);
  }
  /* ?p= follows the open property; other parameters (a preview's ?vista=) stay. */
  function setParam(key, id) {
    var q = new URLSearchParams(location.search);
    if (id) q.set(key, id); else q.delete(key);
    var qs = q.toString();
    try { history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '')); } catch (e) {}
  }
  function setFocus(id) { setParam('p', id); }
  function closeSheet() {
    if (sheet.open) { if (typeof sheet.close === 'function') sheet.close(); else sheet.removeAttribute('open'); }
  }
  sheet.addEventListener('close', function () { setFocus(null); setParam('s', null); });
  sheet.addEventListener('click', function (e) { if (e.target === sheet) closeSheet(); });

  function share(p, btn) {
    var url = pageLink(p);
    if (navigator.share) { navigator.share({ title: title(p), text: title(p) + ' · ' + money(p), url: url }).catch(function () {}); return; }
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(function () { btn.textContent = t('Copiado', 'Copied'); }).catch(function () {});
  }

  root.addEventListener('click', function (e) {
    var open = e.target.closest('[data-open]');
    if (open) { openSheet(open.getAttribute('data-open')); return; }
    var so = e.target.closest('[data-svc-open]');
    if (so) { openService(so.getAttribute('data-svc-open')); return; }
    var asset = e.target.closest('[data-asset]');
    if (asset) { openAsset(asset.getAttribute('data-asset')); return; }
    var more = e.target.closest('[data-more]');
    if (more) {
      var d = document.getElementById('d-' + more.getAttribute('data-more'));
      var on = d && d.classList.toggle('open');
      more.setAttribute('aria-expanded', String(!!on));
      more.textContent = on ? t('Ver menos', 'Show less') : t('Ver más', 'Read more');
      return;
    }
    var op = e.target.closest('[data-op]');
    if (op) { filter.op = op.getAttribute('data-op'); render(); return; }
    var town = e.target.closest('[data-town]');
    if (town) { filter.town = town.getAttribute('data-town'); render(); }
  });

  /* The floating WhatsApp button shows once the hero's own button is off screen. */
  window.addEventListener('scroll', function () {
    var acts = document.getElementById('mp-hero-actions');
    var fl = document.getElementById('mp-float');
    if (!acts || !fl.innerHTML) return;
    fl.classList.toggle('show', acts.getBoundingClientRect().bottom < 0 && !sheet.open);
  }, { passive: true });

  /* Count visits and WhatsApp taps (anonymous), so the agent's panel can later say what their page brings in. */
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[href^="https://wa.me/"]');
    // Sharing an infographic with someone else is not a message to the owner: not counted as interest.
    if (a && data.state === 'active' && !a.hasAttribute('data-share-asset')) miniTrack('mini_interest', { slug: agency.slug, from: a.closest('.mp-svc') ? 'service' : a.classList.contains('mp-interest') || a.closest('.mp-sheet-bar') ? 'property' : 'card' });
  });

  function start(model) {
    data = model; agency = data.agency || {}; listings = data.listings || []; services = data.services || []; assets = data.assets || [];
    PREVIEW = data.state === 'preview'; LIVE = data.state === 'active' || PREVIEW;
    brand();
    render();
    if (data.state === 'active') miniTrack('mini_page_view', { slug: agency.slug, listings: listings.length, services: services.length, property: !!data.focus });
    if (PREVIEW) miniTrack('mini_page_preview', { listings: listings.length });
    if (data.focus) openSheet(data.focus);
    else { var sq = new URLSearchParams(location.search).get('s'); if (sq && LIVE) openService(sq); }
  }

  /* PRIVATE PREVIEW (/:slug?vista=1). The server sends an empty shell; the page itself comes from
     /api/panel?action=preview with the session this browser already holds from the panel (supabase-js keeps it in
     localStorage as sb-<ref>-auth-token; read directly so this page stays SDK-free). A forwarded link has no session
     behind it, so whoever opens it sees "private". An expired session goes once through the panel, which refreshes it
     and comes back; a second failure shows "private" instead of looping. */
  var SESSION_KEY = 'sb-rznuuykmtvbgmnczbqiq-auth-token', RETRY_KEY = 'mp_preview_retry';
  function storedSession() {
    try { var x = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); return x && x.access_token ? x : null; } catch (e) { return null; }
  }
  function showPrivate() { start({ state: 'preview_private', agency: {} }); }
  function viaPanel() {
    try {
      if (sessionStorage.getItem(RETRY_KEY)) { sessionStorage.removeItem(RETRY_KEY); showPrivate(); return; }
      sessionStorage.setItem(RETRY_KEY, '1');
    } catch (e) { showPrivate(); return; }
    location.replace('/panel?preview=1');
  }
  function loadPreview(slug) {
    start({ state: 'preview_loading', agency: {} });
    var sess = storedSession();
    if (!sess) { showPrivate(); return; }
    if (sess.expires_at && sess.expires_at * 1000 < Date.now() + 30000) { viaPanel(); return; }
    fetch('/api/panel?action=preview&slug=' + encodeURIComponent(slug), { headers: { Authorization: 'Bearer ' + sess.access_token }, cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (m) {
        try { sessionStorage.removeItem(RETRY_KEY); } catch (e) {}
        if (m.state !== 'preview') { location.replace('/' + encodeURIComponent(slug)); return; }
        m.focus = new URLSearchParams(location.search).get('p');
        start(m);
      })
      .catch(function (code) { if (code === 401) viaPanel(); else showPrivate(); });
  }

  if (data.state === 'preview_private') loadPreview(agency.slug || location.pathname.slice(1));
  else start(data);
  document.addEventListener('langchange', function () {
    var openId = sheet.open && new URLSearchParams(location.search).get('p');
    render();
    if (openId) openSheet(openId);
  });
})();
</script>
</body>
</html>
