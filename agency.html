<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Portafolio · PropLync.mx</title>
<meta name="description" content="Portafolio de propiedades.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/nav.css">
<link rel="stylesheet" href="/css/components.css">
<style>
  /* ── Agency header: the portfolio's cover ── */
  .ag-hero{background:var(--ink);color:var(--on-ink);padding:56px 0 48px;position:relative;background-size:cover;background-position:center}
  /* A banner is chosen to look good, not to be read over. Without a scrim the
     agency's own name disappears into whatever they uploaded, so the cover
     always sits under a dark wash rather than being rejected for contrast. */
  .ag-hero.has-cover::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(10,22,40,.82),rgba(10,22,40,.92));
  }
  .ag-hero > .wrap{position:relative;z-index:1}

  /* The WhatsApp CTA is the most prominent thing on the page, so it follows the
     agency's colour rather than staying our gold. --ag-accent-ink is computed
     from the colour's luminance: a dark brand would otherwise put .btn-gold's
     dark text on a dark button. */
  body.ag-branded .btn-gold{
    background:var(--ag-accent);
    color:var(--ag-accent-ink);
    box-shadow:none;
  }
  body.ag-branded .btn-gold:hover{filter:brightness(1.07)}
  .ag-hero-inner{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
  .ag-logo{
    width:96px;height:96px;border-radius:var(--radius);flex:none;
    background:var(--white);background-size:contain;background-position:center;background-repeat:no-repeat;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-size:2rem;color:var(--ink);
  }
  .ag-head-text{flex:1;min-width:260px}
  .ag-eyebrow{
    font-family:var(--mono);font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;
    color:var(--gold);display:flex;align-items:center;gap:12px;margin-bottom:10px;
  }
  .ag-eyebrow::before{content:"";width:28px;height:1px;background:var(--gold)}
  .ag-name{font-family:var(--display);font-size:clamp(1.9rem,4vw,3rem);font-weight:300;line-height:1.1;color:var(--on-ink)}
  .ag-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}

  /* ── Portfolio overview: the numbers, before the grid ── */
  .ag-stats{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
    background:rgba(240,237,232,.1);border:1px solid rgba(240,237,232,.1);
    border-radius:var(--radius-lg);overflow:hidden;margin-top:36px;
  }
  .ag-stat{background:var(--ink-2);padding:22px 18px;text-align:center}
  .ag-stat-val{font-family:var(--mono);font-size:1.5rem;font-weight:700;color:var(--on-ink)}
  .ag-stat-lbl{font-family:var(--mono);font-size:.56rem;letter-spacing:.12em;text-transform:uppercase;color:var(--on-ink-dim);margin-top:6px}

  .ag-body{padding:56px 0 100px}
  .ag-toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:26px}
  .ag-count{font-family:var(--mono);font-size:.72rem;color:var(--on-sand-dim);letter-spacing:.06em}
  .ag-chips{display:flex;gap:8px;flex-wrap:wrap}
  .ag-chip{
    font-family:var(--mono);font-size:.66rem;letter-spacing:.05em;
    padding:8px 16px;border-radius:999px;border:1px solid var(--line);
    background:var(--white);color:var(--on-sand-dim);cursor:pointer;
    transition:all var(--duration) ease;
  }
  .ag-chip.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
  .ag-empty{text-align:center;padding:70px 20px;color:var(--on-sand-dim)}
  .ag-state{text-align:center;padding:90px 20px;color:var(--on-sand-dim)}

  /* ── White-label chrome ───────────────────────────────────────────────
     --ag-accent is set at runtime from agencies.primary_color and falls back
     to our gold, so an agency that has not picked a colour still looks
     finished rather than unstyled. */
  :root{--ag-accent:var(--gold)}

  .ag-brand{display:flex;align-items:center;gap:11px;min-width:0;text-decoration:none}
  .ag-brand-mark{
    width:34px;height:34px;border-radius:8px;flex:none;
    background:var(--white);background-size:contain;background-position:center;background-repeat:no-repeat;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-size:1rem;color:var(--ink);font-weight:500;
  }
  .ag-brand-name{
    font-family:var(--display);font-size:1.02rem;font-weight:400;color:var(--on-ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .ag-nav-cta{font-size:.72rem;padding:9px 16px}

  /* The agency's colour drives the accents that were hardcoded gold. */
  .ag-eyebrow{color:var(--ag-accent)}
  .ag-eyebrow::before{background:var(--ag-accent)}
  .ag-stat-val{color:var(--ag-accent)}

  .ag-foot{background:var(--ink);color:var(--on-ink-dim);padding:30px 0}
  .ag-foot-inner{
    display:flex;align-items:center;justify-content:space-between;
    gap:14px;flex-wrap:wrap;
  }
  .ag-foot-by{font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;color:var(--on-ink-faint)}
  .ag-powered{
    display:inline-flex;align-items:center;gap:8px;text-decoration:none;
    font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;
    color:var(--on-ink-dim);
    border:1px solid rgba(240,237,232,.14);border-radius:999px;
    padding:8px 14px;transition:border-color var(--duration) ease,color var(--duration) ease;
  }
  .ag-powered:hover{border-color:var(--gold);color:var(--on-ink)}
  .ag-powered-brand{font-family:var(--display);font-size:.86rem;color:var(--on-ink);letter-spacing:0}
  .ag-powered-cta{
    color:var(--ink);background:var(--gold);border-radius:999px;
    padding:3px 9px;font-weight:700;font-size:.6rem;
  }

  /* Quiet on purpose: it is a way out, not a second brand competing with the
     agency's mark directly below it. */
  .ag-back{background:var(--ink-2,#11203a);border-bottom:1px solid rgba(240,237,232,.08)}
  .ag-back .wrap{padding-top:8px;padding-bottom:8px}
  .ag-back-link{
    display:inline-flex;align-items:center;gap:6px;text-decoration:none;
    font-family:var(--mono);font-size:.68rem;letter-spacing:.04em;
    color:var(--on-ink-dim);transition:color var(--duration) ease;
  }
  .ag-back-link svg{width:14px;height:14px}
  .ag-back-link:hover{color:var(--on-ink)}

  /* ── The agent's card: every way to reach them, and what they do ──────
     The row the ad promises ("WhatsApp · Llamar · Correo · Ubicacion"), the
     services as tags, and a line about them. Each shows only when filled in. */
  .ag-contacts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .ag-contact{
    display:inline-flex;align-items:center;gap:8px;text-decoration:none;
    font-family:var(--mono);font-size:.68rem;letter-spacing:.05em;
    padding:9px 16px;border-radius:999px;border:1px solid rgba(240,237,232,.22);
    color:var(--on-ink);transition:border-color var(--duration) ease,background var(--duration) ease;
  }
  .ag-contact:hover{border-color:var(--ag-accent);background:rgba(240,237,232,.06)}
  .ag-contact svg{width:14px;height:14px;flex:none}
  .ag-bio{margin-top:16px;max-width:60ch;color:var(--on-ink-dim);font-size:.95rem;line-height:1.55}
  .ag-services{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .ag-service{
    font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
    padding:6px 12px;border-radius:6px;color:var(--ag-accent);border:1px solid var(--ag-accent);
  }
  /* "Me interesa" on each card: one tap, this property named, straight to WhatsApp. */
  .pcard-cta{
    font-family:var(--body);font-weight:600;font-size:.74rem;text-decoration:none;
    padding:8px 14px;border-radius:999px;white-space:nowrap;
    background:var(--ag-accent);color:var(--ag-accent-ink,var(--ink));
  }
  .pcard-cta:hover{filter:brightness(1.07)}
  /* A trial that ran out: the card stays, the portfolio waits (api/search.js decides). */
  .ag-paused{
    background:var(--white);border:1px solid var(--line);border-radius:var(--radius-lg);
    padding:28px 24px;text-align:center;color:var(--on-sand-dim);max-width:560px;margin:0 auto;line-height:1.55;
  }
  .ag-paused b{display:block;font-family:var(--display);font-weight:400;font-size:1.3rem;color:var(--ink);margin-bottom:8px}

  @media (max-width:700px){
    .ag-hero{padding:36px 0 32px}
    .ag-logo{width:72px;height:72px}
    .ag-brand-name{max-width:42vw}
    .ag-foot-inner{justify-content:center;text-align:center}
  }
</style>
</head>
<body>

<!-- White label: this page belongs to the agency, so the agency's mark sits in
     the header where a visitor looks for "whose site is this". PropLync appears
     once, in the footer badge. The old header put our logo here and linked to
     /search and /#como — which took an agency's own prospect, standing on the
     agency's own page, and sent them to a marketplace full of competitors. -->
<!-- Shown only to a visitor who arrived from PropLync (see wireBackLink). An
     agency sharing this link with their own prospect gets the clean white-label
     page; someone who walked here from /search or a property page gets the way
     back they expect. -->
<div class="ag-back" id="ag-back" hidden>
  <div class="wrap">
    <a class="ag-back-link" href="/" id="ag-back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <span data-es="Volver a PropLync.mx" data-en="Back to PropLync.mx">Volver a PropLync.mx</span>
    </a>
  </div>
</div>

<header>
  <nav class="wrap">
    <a class="brand ag-brand" id="ag-brand" href="#">
      <span class="ag-brand-mark" id="ag-brand-mark"></span>
      <span class="ag-brand-name" id="ag-brand-name"></span>
    </a>
    <div class="navtools">
      <a class="btn btn-gold ag-nav-cta" id="ag-nav-wa" target="_blank" rel="noopener" style="display:none"
         data-es="WhatsApp" data-en="WhatsApp">WhatsApp</a>
      <div class="lang"><button id="es" class="on" onclick="setLang('es')">ES</button><button id="en" onclick="setLang('en')">EN</button></div>
    </div>
  </nav>
</header>

<section class="ag-hero" id="ag-hero" style="display:none">
  <div class="wrap">
    <div class="ag-hero-inner">
      <div class="ag-logo" id="ag-logo"></div>
      <div class="ag-head-text">
        <div class="ag-eyebrow" data-es="Portafolio de propiedades" data-en="Property portfolio">Portafolio de propiedades</div>
        <h1 class="ag-name" id="ag-name"></h1>
        <div class="ag-actions">
          <a id="ag-whatsapp" class="btn btn-gold" target="_blank" rel="noopener" style="display:none" data-es="Escribir por WhatsApp" data-en="Message on WhatsApp">Escribir por WhatsApp</a>
          <!-- "Ver todo el mercado" used to sit here, linking to /search. On a
               white-label page that is the one link that cannot stay: it takes
               a prospect who is already looking at this agency's properties and
               offers them every competing agency instead. -->
        </div>
        <div class="ag-contacts" id="ag-contacts"></div>
        <p class="ag-bio" id="ag-bio" hidden></p>
        <div class="ag-services" id="ag-services"></div>
      </div>
    </div>
    <div class="ag-stats" id="ag-stats"></div>
  </div>
</section>

<main class="ag-body">
  <div class="wrap">
    <div id="ag-state" class="ag-state" data-es="Cargando portafolio..." data-en="Loading portfolio...">Cargando portafolio...</div>
    <div id="ag-paused" class="ag-paused" hidden>
      <b data-es="Esta pagina esta en pausa" data-en="This page is paused">Esta pagina esta en pausa</b>
      <span data-es="El periodo de prueba termino. Los datos de contacto siguen aqui; las propiedades vuelven cuando el agente reactive su pagina." data-en="The trial period has ended. The contact details stay here; the properties come back when the agent reactivates the page.">El periodo de prueba termino. Los datos de contacto siguen aqui; las propiedades vuelven cuando el agente reactive su pagina.</span>
    </div>
    <div id="ag-content" style="display:none">
      <div class="ag-toolbar">
        <div class="ag-count" id="ag-count"></div>
        <div class="ag-chips" id="ag-chips"></div>
      </div>
      <div class="pgrid" id="ag-grid"></div>
    </div>
  </div>
</main>

<!-- The one place PropLync is named. It doubles as the growth loop: every
     agency page is seen by other agents, and ?ref=agency tells us which
     portfolio sent them. -->
<footer class="ag-foot">
  <div class="wrap ag-foot-inner">
    <span class="ag-foot-by" id="ag-foot-by"></span>
    <a class="ag-powered" href="/?ref=agency" target="_blank" rel="noopener">
      <span data-es="Hecho con" data-en="Powered by">Hecho con</span>
      <span class="ag-powered-brand"><span class="wordmark">PropLync<span class="accent">.mx</span></span></span>
      <span class="ag-powered-cta" data-es="Pruebalo gratis" data-en="Try it now">Pruebalo gratis</span>
    </a>
  </div>
</footer>

<script src="/js/escape.js"></script>
<script src="/js/i18n.js"></script>
<script>
  var agency = null;
  var allListings = [];
  var activeFilter = 'all';
  var paused = false;   // the server's word (api/search.js): a trial that ran out

  function slugFromUrl() {
    var params = new URLSearchParams(window.location.search);
    if (params.get('slug')) return params.get('slug');
    // /agencia/<slug> when the rewrite is bypassed (e.g. opened directly)
    var parts = window.location.pathname.split('/').filter(Boolean);
    return parts.length > 1 ? parts[parts.length - 1] : '';
  }

  function money(p) {
    return escapeHtml(p.currency) + ' $' + Number(p.amount || 0).toLocaleString('en-US');
  }

  /* A spec the agency never filled in is absent, not zero. Printing "0 banos"
     on a plot of land states a fact nobody supplied -- and on this page it is
     the agency's own listing saying it, on the agency's own site. */
  function specsHTML(p) {
    return [
      p.bedrooms ? p.bedrooms + ' ' + (lang === 'es' ? 'rec' : 'bd') : null,
      p.bathrooms ? p.bathrooms + ' ' + (lang === 'es'
        ? (p.bathrooms === 1 ? 'bano' : 'banos')
        : 'bath') : null,
      p.size ? p.size + ' m&sup2;' : null
    ].filter(Boolean).map(function (x) { return '<span>' + x + '</span>'; }).join('');
  }

  /* The competitor's whole product is this button: one tap, this property named,
     straight to the agent's WhatsApp. The card around it is itself a link, so the
     click must not bubble up into the property page. */
  function interestHTML(p, title) {
    if (!agency || !agency.whatsapp_number) return '';
    var msg = (lang === 'es' ? 'Hola, me interesa esta propiedad: ' : 'Hi, I am interested in this property: ') +
      title + ' — ' + location.origin + '/property/' + p.public_id;
    var href = safeUrl('https://wa.me/' + String(agency.whatsapp_number).replace(/[^0-9]/g, '') +
      '?text=' + encodeURIComponent(msg));
    if (!href) return '';
    return '<a class="pcard-cta" href="' + href + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">' +
      (lang === 'es' ? 'Me interesa' : 'I am interested') + '</a>';
  }

  function cardHTML(p) {
    var title = lang === 'es' ? (p.title_es || p.title_en) : (p.title_en || p.title_es);
    var opLbl = p.operation === 'sale' ? (lang === 'es' ? 'Venta' : 'For sale') : (lang === 'es' ? 'Renta' : 'For rent');
    var perLbl = p.operation === 'rental' ? (lang === 'es' ? '/mes' : '/mo') : '';
    var photo = cssUrl(p.image);
    return '<article class="pcard" onclick="window.location.href=\'/property/' + p.public_id + '\'">' +
      '<div class="pcard-photo" style="background-color:#142237;background-image:url(\'' + photo + '\')">' +
        '<span class="pcard-badge ' + (p.operation === 'sale' ? 'badge-sale' : 'badge-rental') + '">' + opLbl + '</span>' +
      '</div>' +
      '<div class="pcard-body">' +
        '<div class="pcard-loc">' + [p.neighborhood, p.town].filter(Boolean).map(escapeHtml).join(' &middot; ') + '</div>' +
        '<div class="pcard-title">' + escapeHtml(title) + '</div>' +
        '<div class="pcard-specs">' + specsHTML(p) + '</div>' +
        '<div class="pcard-foot"><span class="pcard-price">' + money(p) + (perLbl ? ' <small>' + perLbl + '</small>' : '') + '</span>' + interestHTML(p, title) + '</div>' +
      '</div></article>';
  }

  /* The overview homlista shows above its grid: what this portfolio contains
     at a glance, before anyone scrolls a single card. */
  function renderStats() {
    var sale = allListings.filter(function (p) { return p.operation === 'sale'; });
    var rent = allListings.filter(function (p) { return p.operation === 'rental'; });
    var towns = allListings.map(function (p) { return p.town; }).filter(Boolean);
    var uniqueTowns = towns.filter(function (t, i) { return towns.indexOf(t) === i; });
    var saleAmounts = sale.map(function (p) { return Number(p.amount || 0); }).filter(Boolean);
    var from = saleAmounts.length ? Math.min.apply(null, saleAmounts) : 0;

    var stats = [
      { val: allListings.length, lbl: lang === 'es' ? 'Propiedades' : 'Properties' },
      { val: sale.length, lbl: lang === 'es' ? 'En venta' : 'For sale' },
      { val: rent.length, lbl: lang === 'es' ? 'En renta' : 'For rent' },
      { val: uniqueTowns.length, lbl: lang === 'es' ? 'Ciudades' : 'Cities' }
    ];
    if (from) {
      stats.push({
        val: '$' + Math.round(from / 1000) + 'k',
        lbl: lang === 'es' ? 'Desde' : 'From'
      });
    }
    document.getElementById('ag-stats').innerHTML = stats.map(function (s) {
      return '<div class="ag-stat"><div class="ag-stat-val">' + s.val + '</div><div class="ag-stat-lbl">' + s.lbl + '</div></div>';
    }).join('');
  }

  function renderChips() {
    var towns = allListings.map(function (p) { return p.town; }).filter(Boolean);
    var uniqueTowns = towns.filter(function (t, i) { return towns.indexOf(t) === i; }).sort();
    var chips = [{ key: 'all', label: lang === 'es' ? 'Todas' : 'All' }]
      .concat(uniqueTowns.map(function (t) { return { key: 'town:' + t, label: t }; }));
    if (allListings.some(function (p) { return p.operation === 'sale'; }) &&
        allListings.some(function (p) { return p.operation === 'rental'; })) {
      chips.push({ key: 'op:sale', label: lang === 'es' ? 'Venta' : 'Sale' });
      chips.push({ key: 'op:rental', label: lang === 'es' ? 'Renta' : 'Rent' });
    }
    // A single chip filters nothing — don't show a control that can't do anything.
    document.getElementById('ag-chips').innerHTML = chips.length > 2
      ? chips.map(function (c) {
          /* The key rides in a data attribute, not in the onclick source: a town
             name is agency text, and quoting it into JavaScript inside an
             HTML attribute is two escaping contexts deep. */
          return '<button class="ag-chip' + (c.key === activeFilter ? ' on' : '') + '" data-key="' + escapeHtml(c.key) + '" onclick="setFilter(this.dataset.key)">' + escapeHtml(c.label) + '</button>';
        }).join('')
      : '';
  }

  function setFilter(key) {
    activeFilter = key;
    renderChips();
    renderGrid();
  }

  function renderGrid() {
    var shown = allListings.filter(function (p) {
      if (activeFilter === 'all') return true;
      if (activeFilter.indexOf('town:') === 0) return p.town === activeFilter.slice(5);
      if (activeFilter.indexOf('op:') === 0) return p.operation === activeFilter.slice(3);
      return true;
    });
    document.getElementById('ag-count').textContent = shown.length +
      (lang === 'es' ? (shown.length === 1 ? ' propiedad' : ' propiedades') : (shown.length === 1 ? ' property' : ' properties'));
    document.getElementById('ag-grid').innerHTML = shown.length
      ? shown.map(cardHTML).join('')
      : '<p class="ag-empty">' + (lang === 'es' ? 'Sin propiedades en este filtro.' : 'No properties match this filter.') + '</p>';
  }

  /* A hex from the database, or nothing. Anything else is ignored rather than
     written into a style attribute. */
  function safeColor(value) {
    return /^#[0-9a-f]{3,8}$/i.test(String(value || '').trim()) ? String(value).trim() : null;
  }

  /* An agency picking navy for their brand should not get navy text on a navy
     button. Score both candidates by actual WCAG contrast and take the winner,
     rather than splitting on a luminance threshold: our own gold sits at
     L=0.42, so any sensible-looking cutoff hands it light text at 1.97:1 when
     the dark ink it already ships with scores 7.4:1. */
  var INK_DARK = '#0a1628';
  var INK_LIGHT = '#f5f1ea';

  function relativeLuminance(hex) {
    var h = String(hex).replace('#', '').slice(0, 6);
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    if (h.length !== 6) return null;
    var channel = function (v) {
      var c = parseInt(v, 16) / 255;
      return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    };
    return 0.2126 * channel(h.slice(0, 2)) +
           0.7152 * channel(h.slice(2, 4)) +
           0.0722 * channel(h.slice(4, 6));
  }

  function contrastRatio(a, b) {
    var hi = Math.max(a, b), lo = Math.min(a, b);
    return (hi + 0.05) / (lo + 0.05);
  }

  function readableInkOn(hex) {
    var L = relativeLuminance(hex);
    if (L === null) return INK_DARK;
    var dark = contrastRatio(L, relativeLuminance(INK_DARK));
    var light = contrastRatio(L, relativeLuminance(INK_LIGHT));
    return dark >= light ? INK_DARK : INK_LIGHT;
  }

  function applyBranding() {
    var initial = (agency.name || '?').trim().charAt(0).toUpperCase();
    var logoCss = cssUrl(agency.logo_url)
      ? "url('" + cssUrl(agency.logo_url) + "')"
      : '';

    // Header mark: the agency's logo, or their initial on a plain tile.
    var mark = document.getElementById('ag-brand-mark');
    if (logoCss) { mark.style.backgroundImage = logoCss; mark.textContent = ''; }
    else { mark.textContent = initial; }
    document.getElementById('ag-brand-name').textContent = agency.name || '';
    document.getElementById('ag-brand').href = '/agencia/' + encodeURIComponent(agency.slug || '');

    var accent = safeColor(agency.primary_color);
    if (accent) {
      document.documentElement.style.setProperty('--ag-accent', accent);
      document.documentElement.style.setProperty('--ag-accent-ink', readableInkOn(accent));
      document.body.classList.add('ag-branded');
    }

    /* Same rule as the logo: cssUrl keeps the URL inside its CSS string. */
    var hero = document.getElementById('ag-hero');
    if (cssUrl(agency.cover_url)) {
      hero.style.backgroundImage = "url('" + cssUrl(agency.cover_url) + "')";
      hero.classList.add('has-cover');
    } else {
      hero.style.backgroundImage = '';
      hero.classList.remove('has-cover');
    }

    document.getElementById('ag-foot-by').textContent =
      '© ' + new Date().getFullYear() + ' ' + (agency.name || '');

    // The page is the agency's, so it is their name in the tab and in search
    // results, not ours.
    document.title = (agency.name || 'Portafolio') +
      (lang === 'es' ? ' · Propiedades' : ' · Properties');
  }

  function renderAll() {
    document.getElementById('ag-name').textContent = agency.name;
    applyBranding();

    // Each branch clears what the other sets. renderAll runs again on every
    // language change, so a one-sided branch leaves the fallback initial
    // sitting on top of the logo the agency just uploaded.
    var logo = document.getElementById('ag-logo');
    if (agency.logo_url) {
      logo.style.backgroundImage = "url('" + String(agency.logo_url).replace(/'/g, '%27') + "')";
      logo.textContent = '';
    } else {
      logo.style.backgroundImage = '';
      logo.textContent = (agency.name || '?').trim().charAt(0).toUpperCase();
    }

    if (agency.whatsapp_number) {
      // The prospect thinks they are messaging the agency, because they are.
      // Naming our product in their opening line breaks that.
      var msg = lang === 'es'
        ? 'Hola, vi sus propiedades en linea y me interesa una.'
        : 'Hi, I saw your properties online and I am interested in one.';
      var href = 'https://wa.me/' + String(agency.whatsapp_number).replace(/[^0-9]/g, '') +
                 '?text=' + encodeURIComponent(msg);
      ['ag-whatsapp', 'ag-nav-wa'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) { el.href = href; el.style.display = ''; }
      });
    }

    renderCard();
    document.getElementById('ag-hero').style.display = '';
    document.getElementById('ag-state').style.display = 'none';
    /* Paused: the card stays (the contacts are the agent's own), the portfolio does not. */
    document.getElementById('ag-paused').hidden = !paused;
    document.getElementById('ag-stats').style.display = paused ? 'none' : '';
    document.getElementById('ag-content').style.display = paused ? 'none' : '';
    if (paused) return;
    renderStats();
    renderChips();
    renderGrid();
  }

  /* The agent's card under their name. Each item shows only when the agency
     filled it in: an empty row is nothing, not four dead buttons. The location
     button prefers the agency's own maps link and falls back to a maps search
     for the written address. Everything here is agency text: escaped, and
     links only through safeUrl or from digits. */
  var ICON = {
    phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.8 2z"/></svg>',
    mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
    pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>'
  };

  function renderCard() {
    var items = [];
    var digits = String(agency.phone || '').replace(/[^0-9+]/g, '');
    if (digits.replace('+', '').length >= 6) items.push({ icon: 'phone', href: 'tel:' + digits, label: lang === 'es' ? 'Llamar' : 'Call' });
    if (agency.public_email && /^[^\s"'<>@]+@[^\s"'<>@]+$/.test(agency.public_email)) {
      items.push({ icon: 'mail', href: 'mailto:' + agency.public_email, label: lang === 'es' ? 'Correo' : 'Email' });
    }
    var maps = safeUrl(agency.maps_url) ||
      (agency.address ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(agency.address) : '');
    if (maps) items.push({ icon: 'pin', href: maps, label: lang === 'es' ? 'Ubicacion' : 'Location', blank: true, title: agency.address || '' });
    document.getElementById('ag-contacts').innerHTML = items.map(function (i) {
      return '<a class="ag-contact" href="' + escapeHtml(i.href) + '"' +
        (i.blank ? ' target="_blank" rel="noopener"' : '') +
        (i.title ? ' title="' + escapeHtml(i.title) + '"' : '') + '>' +
        ICON[i.icon] + escapeHtml(i.label) + '</a>';
    }).join('');

    var bio = document.getElementById('ag-bio');
    bio.textContent = agency.bio || '';
    bio.hidden = !agency.bio;

    document.getElementById('ag-services').innerHTML = (agency.services || []).slice(0, 8).map(function (s) {
      return '<span class="ag-service">' + escapeHtml(s) + '</span>';
    }).join('');
  }

  document.addEventListener('langchange', function () {
    if (agency) renderAll();
  });

  /* Who gets the way back: someone who walked here from a Proplync page, and
     nobody else. Two signals, because neither alone is enough.

     document.referrer covers the organic path (/search -> a property -> "ver
     todo de esta agencia") but is empty on a hard reload, so the link would
     vanish under the visitor mid-browse.

     ?from=proplync is set on the links we control and survives reloads, so it
     is remembered for the tab: the agency's own shared link carries neither
     signal and stays clean. sessionStorage rather than localStorage, so it
     expires with the tab instead of marking this browser forever. */
  var BACK_FLAG = 'proplync:came-from-us';

  function cameFromProplync() {
    try {
      var params = new URLSearchParams(location.search);
      if (params.get('from') === 'proplync') {
        sessionStorage.setItem(BACK_FLAG, '1');
        return true;
      }
      if (sessionStorage.getItem(BACK_FLAG) === '1') return true;
      if (document.referrer) {
        var ref = new URL(document.referrer);
        /* Same origin only, and not another agency page -- walking from one
           portfolio to another is not arriving from the marketplace. */
        if (ref.origin === location.origin && !/^\/(agencia|agency)\//.test(ref.pathname)) {
          sessionStorage.setItem(BACK_FLAG, '1');
          return true;
        }
      }
    } catch (e) {
      /* Private mode can throw on sessionStorage; a missing back link is the
         safe failure here, not a broken page. */
    }
    return false;
  }

  function wireBackLink() {
    if (!cameFromProplync()) return;
    var bar = document.getElementById('ag-back');
    /* Back to where they actually were when we know it, the home page when we
       do not -- a reload has no referrer but may still have the flag. */
    try {
      var ref = document.referrer ? new URL(document.referrer) : null;
      if (ref && ref.origin === location.origin && ref.pathname !== location.pathname) {
        document.getElementById('ag-back-link').href = ref.pathname + ref.search;
      }
    } catch (e) { /* keep the "/" default */ }
    bar.hidden = false;
  }

  (async function init() {
    wireBackLink();
    var slug = slugFromUrl();
    var state = document.getElementById('ag-state');
    if (!slug) {
      state.textContent = lang === 'es' ? 'Falta el nombre de la agencia en la direccion.' : 'No agency specified in the URL.';
      return;
    }
    try {
      var r = await fetch('/api/search?agency=' + encodeURIComponent(slug));
      if (r.status === 404) {
        state.textContent = lang === 'es' ? 'No encontramos esta agencia.' : 'We could not find this agency.';
        return;
      }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var data = await r.json();
      agency = data.agency;
      allListings = data.listings || [];
      paused = Boolean(data.paused);
      renderAll();
    } catch (e) {
      state.textContent = lang === 'es'
        ? 'No pudimos cargar el portafolio. Intenta de nuevo.'
        : 'We could not load this portfolio. Please try again.';
    }
  })();
</script>
</body>
</html>
