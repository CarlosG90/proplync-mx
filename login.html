<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title data-es="Iniciar sesion &middot; Proplync.mx" data-en="Log in &middot; Proplync.mx">Iniciar sesion &middot; Proplync.mx</title>
<meta name="description" content="Accede al panel de tu inmobiliaria en Proplync.mx.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/nav.css">
<link rel="stylesheet" href="/css/components.css">
<style>
  .auth-main{padding:80px 20px;min-height:calc(100vh - 200px);display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>

<header>
  <nav class="wrap">
    <a class="brand" href="/">
      <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 2.2l12.4 6.4v9.2c0 7.4-5.3 11.9-12.4 14-7.1-2.1-12.4-6.6-12.4-14V8.6L16 2.2z" fill="#c9a96e"/><path d="M11.8 24.2v-6.9a4.2 4.2 0 0 1 8.4 0v6.9" stroke="#0a1628" stroke-width="2.2" stroke-linecap="round"/></svg>
      Proplync<span class="accent">.mx</span>
    </a>
    <div class="navlinks" id="navlinks">
      <a href="/search" data-es="Buscar" data-en="Search">Buscar</a>
      <a href="/#como" data-es="Como funciona" data-en="How it works">Como funciona</a>
      <a href="/signup" data-es="Soy agente" data-en="I'm an agent">Soy agente</a>
    </div>
    <div class="navtools">
      <div class="lang"><button id="es" class="on" onclick="setLang('es')">ES</button><button id="en" onclick="setLang('en')">EN</button></div>
    </div>
    <button class="navtoggle" onclick="document.getElementById('navlinks').classList.toggle('open')"><span></span><span></span><span></span></button>
  </nav>
</header>

<!-- Hidden until the session check at the bottom of this page resolves, so an
     agent who still has a live session never sees the form flash before being
     sent to the dashboard. Unhidden unconditionally if anything goes wrong — a
     form nobody can see is worse than a form that flashes. -->
<!-- Signing in needs JS anyway, but a blank page is a worse way to say so. -->
<noscript><style>#auth-main[hidden]{display:block!important}</style></noscript>
<main class="auth-main" id="auth-main" hidden>
  <div class="auth-card">
    <h1 data-es="Bienvenido de vuelta" data-en="Welcome back">Bienvenido de vuelta</h1>
    <p class="sub" data-es="Accede al panel de tu inmobiliaria." data-en="Access your agency's dashboard.">Accede al panel de tu inmobiliaria.</p>

    <div id="form-error" style="display:none" class="form-error"></div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="field">
        <label class="form-label" for="email" data-es="Correo electronico" data-en="Email">Correo electronico</label>
        <input class="form-input" id="email" type="email" required>
      </div>
      <div class="field">
        <label class="form-label label-row" for="password">
          <span data-es="Contrasena" data-en="Password">Contrasena</span>
          <a class="label-link" href="/forgot" data-es="&iquest;La olvidaste?" data-en="Forgot it?">&iquest;La olvidaste?</a>
        </label>
        <input class="form-input" id="password" type="password" required>
      </div>
      <button class="btn btn-gold btn-block" type="submit" id="login-btn" data-es="Iniciar sesion" data-en="Log in">Iniciar sesion</button>
    </form>

    <div class="switch" data-es="&iquest;No tienes cuenta? <a href='/signup'>Acceso por invitacion</a>" data-en="Don't have an account? <a href='/signup'>Invite only</a>">&iquest;No tienes cuenta? <a href="/signup">Acceso por invitacion</a></div>
  </div>
</main>

<footer>
  <div class="wrap foot">
    <a class="brand" href="/">
      <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 2.2l12.4 6.4v9.2c0 7.4-5.3 11.9-12.4 14-7.1-2.1-12.4-6.6-12.4-14V8.6L16 2.2z" fill="#c9a96e"/><path d="M11.8 24.2v-6.9a4.2 4.2 0 0 1 8.4 0v6.9" stroke="#0a1628" stroke-width="2.2" stroke-linecap="round"/></svg>
      Proplync<span class="accent">.mx</span>
    </a>
    <span data-es="Hecho en la Riviera Maya &middot; para agencias en cualquier mercado" data-en="Built in the Riviera Maya &middot; for agencies in any market">Hecho en la Riviera Maya &middot; para agencias en cualquier mercado</span>
    <span class="mono" style="font-size:.72rem;opacity:.5">&copy; 2026</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/supabase-client.js"></script>
<script>
  async function handleLogin(evt) {
    evt.preventDefault();
    const errEl = document.getElementById('form-error');
    errEl.style.display = 'none';
    const btn = document.getElementById('login-btn');
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    btn.disabled = true;
    btn.textContent = lang === 'es' ? 'Entrando...' : 'Signing in...';

    try {
      const sbClient = initSupabase();
      const { error } = await sbClient.auth.signInWithPassword({ email, password });
      if (error) throw new Error(lang === 'es' ? 'Correo o contrasena incorrectos.' : 'Incorrect email or password.');
      window.location.href = '/dashboard';
    } catch (e) {
      /* textContent, not innerHTML: the message can come straight from the
         auth server. Replacing the children also clears the link appended by
         any previous failed attempt. */
      errEl.textContent = e.message + ' ';
      const help = document.createElement('a');
      help.href = '/forgot';
      help.setAttribute('data-es', '&iquest;Olvidaste tu contrasena?');
      help.setAttribute('data-en', 'Forgot your password?');
      help.textContent = lang === 'es' ? '¿Olvidaste tu contrasena?' : 'Forgot your password?';
      errEl.appendChild(help);
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = lang === 'es' ? 'Iniciar sesion' : 'Log in';
    }
  }

  document.querySelectorAll('#navlinks a').forEach(a => a.addEventListener('click', () => document.getElementById('navlinks').classList.remove('open')));

  /* ---------- already signed in? ----------
     The session lives in localStorage and survives navigation, but this page
     used to ignore it: an agent who came back to /login got an empty form and
     retyped a password they did not need to. That is the whole "my session
     doesn't stay logged in" complaint — the session was never lost, the page
     just never asked.

     location.replace, not href: with href, Back lands here again, this redirect
     fires again, and the agent can never navigate backwards out of the
     dashboard.

     /login?switch=1 skips the check, so signing in as a different agency is
     still possible without signing out of the current one first. */
  (async function revealOrRedirect() {
    const main = document.getElementById('auth-main');
    const wantsSwitch = new URLSearchParams(location.search).has('switch');
    if (!wantsSwitch) {
      try {
        if (await getSession()) {
          window.location.replace('/dashboard');
          return;                       // leave it hidden; we are navigating away
        }
      } catch (e) {
        /* Network down, CDN blocked, storage unavailable: fall through and show
           the form. Signing in by hand still works, which is the point. */
      }
    }
    main.hidden = false;
  })();
</script>
</body>
</html>
