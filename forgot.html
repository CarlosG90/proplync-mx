      Proplync<span class="accent">.mx</span>

    <div class="navlinks" id="navlinks">

<main class="auth-main">
  <div class="auth-card">
    <h1 data-es="Recuperar contrasena" data-en="Reset your password">Recuperar contrasena</h1>
    <p class="sub" data-es="Te enviaremos un enlace para crear una contrasena nueva." data-en="We'll email you a link to create a new password.">Te enviaremos un enlace para crear una contrasena nueva.</p>

    <div id="form-error" style="display:none" class="form-error"></div>
    <div id="form-success" style="display:none" class="form-success"></div>

    <form id="forgot-form" onsubmit="handleForgot(event)">
      <div class="field">
        <label class="form-label" for="email" data-es="Correo electronico" data-en="Email">Correo electronico</label>
        <input class="form-input" id="email" type="email" autocomplete="email" required>
      </div>
      <button class="btn btn-gold btn-block" type="submit" id="forgot-btn" data-es="Enviar enlace" data-en="Send link">Enviar enlace</button>
    </form>

    <div class="switch" data-es="&iquest;Ya la recordaste? <a href='/login'>Iniciar sesion</a>" data-en="Remembered it? <a href='/login'>Log in</a>">&iquest;Ya la recordaste? <a href="/login">Iniciar sesion</a></div>
  </div>
</main>

<footer>
  <div class="wrap foot">
    <a class="brand" href="/">
      <svg class="mark" viewBox="0 0 32 32" fill="none"><path d="M16 3l11 6v9c0 6.4-4.7 10.4-11 12-6.3-1.6-11-5.6-11-12V9l11-6z" fill="currentColor" opacity=".06"/><path d="M16 3l11 6v9c0 6.4-4.7 10.4-11 12-6.3-1.6-11-5.6-11-12V9l11-6z" fill="none" stroke="currentColor" stroke-width=".8" opacity=".3"/><path d="M8 20c2.4-3 5.6-3 8 0s5.6 3 8 0" stroke="#c9a96e" stroke-width="1.6" stroke-linecap="round"/><path d="M8 15.5c2.4-3 5.6-3 8 0s5.6 3 8 0" stroke="#5ec4be" stroke-width="1.6" stroke-linecap="round"/></svg>
      Proplync<span class="accent">.mx</span>
    </a>
    <span data-es="Riviera Maya &middot; Tulum &middot; Playa del Carmen &middot; Cancun" data-en="Riviera Maya &middot; Tulum &middot; Playa del Carmen &middot; Cancun">Riviera Maya &middot; Tulum &middot; Playa del Carmen &middot; Cancun</span>
    <span class="mono" style="font-size:.72rem;opacity:.5">&copy; 2026</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/supabase-client.js"></script>
<script>
  /* Set both translations so the ES/EN toggle keeps working on text
     we injected from JS, the same way static [data-es] nodes do. */
  function setMessage(el, es, en) {
    el.setAttribute('data-es', es);
    el.setAttribute('data-en', en);
    el.innerHTML = lang === 'es' ? es : en;
    el.style.display = 'block';
  }

  /* Supabase throttles recovery mail two different ways, and they need
     different advice:
       - a short per-address cooldown, whose length it tells us in the error
         ("...you can only request this after 47 seconds")
       - a project-wide hourly cap on the shared SMTP service, which it does
         not quantify at all
     Guessing "a few minutes" for the second one sends people back to retry
     into a wall. Count down when we know the number, say the honest thing
     when we don't. */
  let cooldownTimer = null;

  function startCooldown(seconds) {
    const btn = document.getElementById('forgot-btn');
    clearInterval(cooldownTimer);
    let left = seconds;
    btn.disabled = true;
    const tick = () => {
      if (left <= 0) {
        clearInterval(cooldownTimer);
        cooldownTimer = null;
        btn.disabled = false;
        btn.textContent = lang === 'es' ? 'Enviar enlace' : 'Send link';
        return;
      }
      btn.textContent = (lang === 'es' ? 'Espera ' : 'Wait ') + left + 's';
      left--;
    };
    tick();
    cooldownTimer = setInterval(tick, 1000);
  }

  function showRateLimit(error) {
    const errEl = document.getElementById('form-error');
    const btn = document.getElementById('forgot-btn');
    const raw = (error && error.message) || '';
    const match = raw.match(/after (\d+) seconds?/i);

    if (match) {
      const secs = parseInt(match[1], 10);
      setMessage(errEl,
        'Ya pediste un enlace hace poco. Puedes intentar de nuevo en ' + secs + ' segundos.',
        'You just requested a link. You can try again in ' + secs + ' seconds.');
      startCooldown(secs);
      return;
    }

    /* No number means the project-wide send cap, which resets on the hour,
       not in "a few minutes". Point at a human instead of a retry loop. */
    setMessage(errEl,
      'Alcanzamos el limite de correos de recuperacion por ahora. Puede tardar hasta una hora en liberarse. Si es urgente, escribenos a <a href="mailto:hola@proplync.mx">hola@proplync.mx</a> y te ayudamos a entrar.',
      'We have hit the recovery email limit for now. It can take up to an hour to clear. If this is urgent, email <a href="mailto:hola@proplync.mx">hola@proplync.mx</a> and we will get you back in.');
    btn.disabled = false;
    btn.textContent = lang === 'es' ? 'Enviar enlace' : 'Send link';
  }

  async function handleForgot(evt) {
    evt.preventDefault();
    const errEl = document.getElementById('form-error');
    const okEl = document.getElementById('form-success');
    errEl.style.display = 'none';
    const btn = document.getElementById('forgot-btn');
    const email = document.getElementById('email').value.trim();

    btn.disabled = true;
    btn.textContent = lang === 'es' ? 'Enviando...' : 'Sending...';

    try {
      const sbClient = initSupabase();
      const { error } = await sbClient.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/reset'
      });
      /* Rate limiting is the one failure worth surfacing. Anything else is
         swallowed on purpose: a "no such account" error would let anyone
         test which emails are registered here. */
      if (error && error.status === 429) {
        showRateLimit(error);
        return;
      }

      document.getElementById('forgot-form').style.display = 'none';
      setMessage(okEl,
        'Si existe una cuenta con ese correo, te enviamos un enlace. Revisa tu bandeja y la carpeta de spam &mdash; el enlace vence en una hora.',
        'If an account exists for that email, we sent a link. Check your inbox and spam folder &mdash; the link expires in one hour.');
    } catch (e) {
      setMessage(errEl, e.message, e.message);
      btn.disabled = false;
      btn.textContent = lang === 'es' ? 'Enviar enlace' : 'Send link';
    }
  }

  document.querySelectorAll('#navlinks a').forEach(a => a.addEventListener('click', () => document.getElementById('navlinks').classList.remove('open')));
</script>
</body>
</html>
